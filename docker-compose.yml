name: kunpeng-self-hosted

services:
  kunpeng:
    build:
      context: .
      dockerfile: Dockerfile
    image: kunpeng-orchestrator:local
    user: "${KUNPENG_UID:-1000}:${KUNPENG_GID:-1000}"
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      KUNPENG_HOST: 0.0.0.0
      KUNPENG_STATE: /var/lib/kunpeng
      KUNPENG_REPO: /workspace/repo
      # AI 后端登录态落在持久化的状态目录里，重建容器不丢
      CLAUDE_CONFIG_DIR: /var/lib/kunpeng/backend-auth/claude
      CODEX_HOME: /var/lib/kunpeng/backend-auth/codex
    command:
      - serve
      - "7777"
      - --host
      - 0.0.0.0
      - --repo
      - /workspace/repo
    ports:
      - "127.0.0.1:7777:7777"
    volumes:
      # KUNPENG_STATE 内含跨项目 state 与 captures。
      - type: bind
        source: "${KUNPENG_STATE}"
        target: /var/lib/kunpeng
      - type: bind
        source: "${KUNPENG_REPO}"
        target: /workspace/repo
